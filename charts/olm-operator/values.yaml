# Generic defaults. Component defaults live in components/<name>/values.yaml,
# group overrides in group-values/<group>/<name>.yaml and cluster overrides in
# the environment repo (config/values/<name>.yaml).

namespace:
  create: true
  # defaults to the Argo CD destination namespace (.Release.Namespace)
  name: ""
  labels: {}
  annotations: {}

operatorGroup:
  create: true
  name: ""
  # empty list = AllNamespaces install mode
  targetNamespaces: []
  upgradeStrategy: Default

# Operator versions keyed by release name (= component name). Set them in
# components/versions.yaml, group-values/<group>/versions.yaml and the cluster
# environment repo - not here. Fields per component:
#   channel              OLM channel
#   version              exact operator version (x.y.z) - REQUIRED with Manual approval
#   csv                  full CSV name, only if subscription.csvFormat cannot build it
#   installPlanApproval  Manual (default) | Automatic
#   dependencies         exact CSVs of the OLM dependencies of this version
#                        (generated by scripts/olm-dependencies.py)
# Extra keys (e.g. an operand version) are allowed and can be used in extraObjects.
versions: {}

subscription:
  name: ""            # package name (required)
  channel: ""         # fallback when versions.<component>.channel is not set
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  # printf format turning versions.<component>.version into the CSV name.
  # Default "<name>.v%s". ODF: "odf-operator.v%s-rhodf".
  csvFormat: ""
  # OLM dependencies that may appear in the same InstallPlan as this operator:
  # exact CSV names (strict) or CSV name prefixes. Prefer versions.<name>.dependencies,
  # generated per version by scripts/olm-dependencies.py; this is the fallback.
  dependencies: []
  config: {}          # Subscription .spec.config (nodeSelector, tolerations, env...)

# InstallPlan approver: an Argo CD Sync hook Job (one per operator namespace)
# that approves only the InstallPlan carrying the exact CSV from versions.
# Rendered when the effective installPlanApproval is Manual.
approver:
  # oc client image, mirrored for airgapped clusters (oc-mirror additionalImages).
  # Set once in components/versions.yaml (approver.image).
  image: ""
  timeoutSeconds: 900
  pollSeconds: 10
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  # Approvers for Subscriptions the operator creates itself at runtime, in
  # another namespace (e.g. ACM creates multicluster-engine). Each entry:
  #   namespace        namespace of that Subscription
  #   subscription     its name
  #   versionKey       key in versions.<component> holding its exact version
  #   channelKey       key in versions.<component> holding its channel (informational,
  #                    used by olm-upgrade-analyzer's GitOps export)
  #   csvFormat        printf format for the CSV name, e.g. multicluster-engine.v%s
  #   csv              full CSV name instead of versionKey + csvFormat
  #   csvFromMain      CSV name prefix for a Subscription always at the main
  #                    operator's version, e.g. odf-dependencies ->
  #                    odf-dependencies.v<same version as odf-operator>
  #   dependenciesKey  key in versions.<component> with the exact dependency CSVs
  #                    of that Subscription (generated per version)
  #   dependencies     fallback CSV name prefixes, as subscription.dependencies
  #   createNamespace  create the namespace so the approver RBAC can land in it
  #   wave             RBAC wave (default 20, after operands); Job runs at wave+1.
  #                    Use a wave before 10 when the operands need that
  #                    Subscription's CRDs (ODF: StorageCluster needs ocs-operator).
  extra: []

# Operand objects (CRs) created after the operator. Each item is a full
# Kubernetes object; strings are rendered with tpl, so {{ .Values.* }} works.
# Default sync-wave is "10" (operator objects use "-10" / "-5").
extraObjects: []
