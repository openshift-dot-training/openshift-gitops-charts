{{- if .Values.operatorGroup.create }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.operatorGroup.name | default (include "olm.namespace" .) }}
  namespace: {{ include "olm.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  upgradeStrategy: {{ .Values.operatorGroup.upgradeStrategy }}
  {{- with .Values.operatorGroup.targetNamespaces }}
  targetNamespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
