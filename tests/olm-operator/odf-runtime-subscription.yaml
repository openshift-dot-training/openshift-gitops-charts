# ODF: odf-operator creates the odf-dependencies Subscription at runtime, in the
# same namespace and at its own version; its plan carries the sub-operators.
# expect: map(select(.kind == "Job")) | length == 2
# expect: map(select(.kind == "Job" and .metadata.name == "test-odf-dependencies-installplan-approver"))[0].metadata.annotations."argocd.argoproj.io/sync-wave" == "-2"
# expect: map(select(.kind == "Job" and .metadata.name == "test-odf-dependencies-installplan-approver"))[0].spec.template.spec.containers[0].env[] | select(.name == "WANT") | .value == "odf-dependencies.v4.18.3-rhodf"
# expect: map(select(.kind == "Job" and .metadata.name == "test-odf-dependencies-installplan-approver"))[0].spec.template.spec.containers[0].env[] | select(.name == "DEPENDENCIES") | .value == "mcg-operator.v4.18.3-rhodf ocs-operator.v4.18.3-rhodf"
# expect: map(select(.kind == "Subscription"))[0].spec.startingCSV == "odf-operator.v4.18.3-rhodf"
subscription: { name: odf-operator, csvFormat: odf-operator.v%s-rhodf }
approver:
  image: registry.example.com/CHANGE-ME/ose-cli:v4.18
  extra:
    - { namespace: openshift-storage, subscription: odf-dependencies, csvFromMain: odf-dependencies,
        dependenciesKey: dependencies, dependencies: [ocs-operator], wave: -3 }
versions:
  test:
    channel: stable-4.18
    version: 4.18.3
    dependencies: [mcg-operator.v4.18.3-rhodf, ocs-operator.v4.18.3-rhodf]
