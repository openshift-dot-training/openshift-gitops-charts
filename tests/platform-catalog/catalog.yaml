# Minimal catalog for the hub chart tests.
# expect: map(select(.kind == "ApplicationSet")) | length == 3
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "odf"))[0].spec.generators[0].clusters.selector.matchExpressions[0].values | (length == 1 and .[0] == "group-a")
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "loki"))[0].spec.generators[0].clusters.selector.matchExpressions[0].operator == "Exists"
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "odf"))[0].spec.template.spec.sources[1].targetRevision == "{{ index .metadata.labels \"chartsRevision\" | default \"v0.1.0\" }}"
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "odf"))[0].spec.template.spec.sources[1].helm.valueFiles[5] == "$config/clusters/{{ .name }}/values/odf.yaml"
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "odf"))[0].spec.template.spec.sources[1].helm.valueFiles[2] == "$config/group-values/{{ index .metadata.labels \"platform/group\" | default \"_none\" }}/versions.yaml"
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "external-chart"))[0].spec.template.spec.sources[2].path == "clusters/{{ .name }}/manifests/external-chart"
# expect: map(select(.kind == "Placement")) | length == 2
# expect: map(select(.kind == "Policy" and .metadata.name == "odf-health")) | length == 1
components:
  odf: { namespace: openshift-storage, operator: { name: odf-operator } }
  loki: { namespace: openshift-operators-redhat, operator: { name: loki-operator } }
  # a component whose chart lives in another repository, with raw per-cluster manifests
  external-chart: { namespace: external-chart, repoURL: https://git.example.com/CHANGE-ME/other-charts.git, chart: charts/any-chart, clusterManifests: true }
