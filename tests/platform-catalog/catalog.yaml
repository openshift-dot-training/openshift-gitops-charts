# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "odf"))[0].spec.template.spec.sources[1].helm.valueFiles[3] == "$config/clusters/{{ .name }}/main-values.yaml"
# expect: map(select(.kind == "ApplicationSet" and .metadata.name == "external-chart"))[0].spec.template.spec.sources[2].path == "clusters/{{ .name }}/manifests/external-chart"
acm:
  clusterSets: [global, prod]
components:
  odf: { namespace: openshift-storage, operator: { name: odf-operator } }
  loki: { namespace: openshift-operators-redhat, operator: { name: loki-operator } }
  # a component whose chart lives in another repository, with raw per-cluster manifests
  external-chart: { namespace: external-chart, repoURL: https://git.example.com/CHANGE-ME/other-charts.git, chart: charts/any-chart, clusterManifests: true }
